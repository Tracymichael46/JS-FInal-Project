<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js"></script>
    <script src="https://kit.fontawesome.com/68d8f55be8.js" crossorigin="anonymous"></script>
</head>
<body>
   <header class="navbar">
        <div class="navbar__wrapper">
           <div class="logo">
            <img src="https://dev.d24jig8s1lr7n9.amplifyapp.com/img/blinker-icon.4f9b2663.png" alt="blinker logo" class="logo">
           </div>
           <div class="nav__links">
                <a href="#" class="nav__link">Home</a> 
                <a href="#" class="nav__link">Find your movie</a> 
                <a href="#" class=" nav__link--primary">Contact</a> 
           </div>
            </div>
             <div id="phone__nav">
               <div class="menu" onclick="togglemenu()">
                  <i class="fa-solid fa-bars"></i>
               </div>
               <div class="close__btn">
                  <i class="fa-solid fa-x"></i>
               </div>
               <div class="show__menu">
                  <a href="/" class="menu__link">Home</a>
                  <a href="/" class="menu__link">Find a Movie</a>
                  <a href="/" class="menu__link">Contact</a>
               </div>
           </div>
        </div>
   </header>
   <section id="landing__page">
      <div class="landing__page--wrapper">
         <h1 class="landing__page--title">America's most awarded movie rental platform</h1>
         <h2 class="landing__page--sub-title">Find a movie with <span class="purple">BLINKER</span></h2>
         <div class="input__wrapper">
            <input type="text" placeholder="Search for a movie!">
            <button class="search__btn"><i class="fa-solid fa-magnifying-glass"></i></button>
         </div>
         <img src="https://dev.d24jig8s1lr7n9.amplifyapp.com/img/building.681ea6bf.png" alt="" class="img__landing">
      </div>
   </section>
</body>
</html>
